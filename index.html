function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function owl(){return `<svg class="owl" viewBox="0 0 250 250" role="img" aria-label="可愛貓頭鷹冒險嚮導" xmlns="http://www.w3.org/2000/svg"><ellipse cx="124" cy="229" rx="88" ry="13" fill="#e6c8b3"/><path d="M53 91 44 32l48 31Q125 49 157 63l48-31-8 59q24 27 20 66-4 70-91 72-87-2-91-72-3-39 18-66Z" fill="#b8784b" stroke="#92583e" stroke-width="5"/><path d="M69 109q-26 48 6 83 17 20 50 20 32 0 50-20 31-35 5-83-19-21-55-13-36-8-56 13Z" fill="#f5d2a3"/><ellipse cx="90" cy="119" rx="31" ry="37" fill="#fffaf0"/><ellipse cx="160" cy="119" rx="31" ry="37" fill="#fffaf0"/><circle cx="96" cy="124" r="13" fill="#3f3935"/><circle cx="155" cy="124" r="13" fill="#3f3935"/><circle cx="100" cy="119" r="4" fill="white"/><circle cx="159" cy="119" r="4" fill="white"/><path d="m124 139-15 11 15 12 15-12Z" fill="#f4a34d"/><path d="M58 160q-29 4-23 31 6 20 39 10" fill="#a86c48" stroke="#92583e" stroke-width="4"/><path d="M191 160q29 4 23 31-6 20-39 10" fill="#a86c48" stroke="#92583e" stroke-width="4"/><rect x="83" y="169" width="83" height="49" rx="9" fill="#e95d58" stroke="#b84842" stroke-width="4"/><path d="M124 170v46" stroke="#fff0d9" stroke-width="4"/><path d="M103 190h12m20 0h12" stroke="#ffdb98" stroke-width="4" stroke-linecap="round"/><path d="M105 221v12m39-12v12" stroke="#92583e" stroke-width="8" stroke-linecap="round"/><path d="M70 54q55-36 110 0" stroke="#e5a35e" stroke-width="8" stroke-linecap="round" fill="none"/></svg>`}
function home(){state.view='home';app.innerHTML=`<div class="hero"><div><span class="eyebrow">✨ 12月4日 · 國家憲法日</span><h1>憲法小達人<br><span>知識冒險島</span></h1><p class="sub">跟着貓頭鷹博士，踏上知識冒險！<br>連闖所有關卡，全部答對就能獲獎！</p></div>${owl()}</div><div class="levelgrid"><button class="level junior" data-level="junior"><span class="emoji">🌱</span><strong>初級挑戰</strong><small>小一至小三 · 2關 · 每關1題<br>兩題全對獲獎　➜</small></button><button class="level senior" data-level="senior"><span class="emoji">🏆</span><strong>進階挑戰</strong><small>小四至小六 · 3關 · 每關1題<br>三題全對獲獎　➜</small></button></div><p class="hint">🧩 每關從10題題庫隨機抽出1題；每題只有一次確認答案的機會。</p>`;app.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.level)))}
function start(level){state={view:'game',level,step:0,answers:[],q:null,selected:null,submitted:false,optionOrder:[]};loadQuestion()}
function loadQuestion(){const stage=levels[state.level][state.step];state.q=draw(stage);state.selected=null;state.submitted=false;state.optionOrder=shuffle([state.q[2],state.q[3],state.q[4]]);renderQuestion()}
function picture(q){
 const id=q[0];if(!id.startsWith('L'))return '';
 // Official artwork hosted by the Hong Kong SAR Government Protocol Division.
 // Do not substitute hand-drawn flags or emblems for these questions.
 const official={
  L01:['https://www.protocol.gov.hk/images/natflags.png','中華人民共和國國旗'],
  L02:['https://www.protocol.gov.hk/images/natemblems.png','中華人民共和國國徽'],
  L03:['https://www.protocol.gov.hk/images/flag01s.gif','香港特別行政區區旗'],
  L04:['https://www.protocol.gov.hk/images/emblem01s.gif','香港特別行政區區徽'],
  L15:['https://www.protocol.gov.hk/images/flag01s.gif','香港特別行政區區旗']
 };
 if(official[id]){const [src,alt]=official[id];return `<div class="picture official-picture"><img src="${src}" alt="${alt}" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="asset-error" style="display:none">官方圖片暫時未能載入，請檢查網絡連線。<br>本題不應計分，請由大使重新開始。</div></div>`;}

 const card=(body)=>`<div class="picture"><svg viewBox="0 0 360 170" role="img" aria-label="題目插圖" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="6" width="336" height="158" rx="25" fill="#fff3d9"/>${body}</svg></div>`;
 const txt=(x,y,t,size=20,color='#7a4b39')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="PingFang HK,Microsoft JhengHei,sans-serif" font-weight="800" font-size="${size}" fill="${color}">${t}</text>`;
 const flag=(hk=false)=>`<path d="M100 22v130" stroke="#806453" stroke-width="7" stroke-linecap="round"/><rect x="105" y="24" width="162" height="101" rx="2" fill="#df3436"/>${hk?`<g fill="white" transform="translate(185 73)"><ellipse cx="0" cy="-18" rx="9" ry="24"/><ellipse cx="0" cy="-18" rx="9" ry="24" transform="rotate(72)"/><ellipse cx="0" cy="-18" rx="9" ry="24" transform="rotate(144)"/><ellipse cx="0" cy="-18" rx="9" ry="24" transform="rotate(216)"/><ellipse cx="0" cy="-18" rx="9" ry="24" transform="rotate(288)"/></g>`:`<text x="138" y="68" fill="#ffe06a" font-size="36">★</text><text x="190" y="46" fill="#ffe06a" font-size="14">★</text><text x="211" y="63" fill="#ffe06a" font-size="14">★</text><text x="208" y="87" fill="#ffe06a" font-size="14">★</text><text x="187" y="102" fill="#ffe06a" font-size="14">★</text>`}`;
 const book=(name,col)=>`<rect x="106" y="22" width="148" height="126" rx="10" fill="${col}" stroke="#a46b55" stroke-width="3"/><path d="M125 23v123" stroke="#ffffff88" stroke-width="4"/>${txt(190,85,name,28,'#fff')}${txt(190,115,'知識之書',15,'#fff3d9')}`;
 const calendar=(date)=>`<rect x="104" y="19" width="152" height="132" rx="14" fill="white" stroke="#e4bb93" stroke-width="4"/><path d="M104 52h152" stroke="#e75c58" stroke-width="28"/>${txt(180,40,'12月',17,'white')}${txt(180,121,date,55,'#b54c48')}`;
 const school=`<path d="M95 69 180 21l85 48" fill="#f1b85e" stroke="#ba754b" stroke-width="6"/><rect x="105" y="67" width="150" height="85" fill="#fce4b4" stroke="#d39b68" stroke-width="4"/><rect x="163" y="100" width="34" height="52" fill="#b6dce6"/><rect x="123" y="84" width="25" height="26" fill="#9fd5e2"/><rect x="212" y="84" width="25" height="26" fill="#9fd5e2"/>${txt(180,66,'學校',17,'#804a35')}`;
 const people=`<circle cx="135" cy="59" r="24" fill="#f5c8a3"/><circle cx="225" cy="59" r="24" fill="#e9b98c"/><path d="M98 151q0-61 37-61t37 61" fill="#80c6a8"/><path d="M188 151q0-61 37-61t37 61" fill="#8fb5e8"/><path d="m163 114 17 12 17-12" fill="none" stroke="#ed8a7b" stroke-width="8" stroke-linecap="round"/>`;
 const globe=`<circle cx="180" cy="84" r="65" fill="#9ad6e5" stroke="#5babbc" stroke-width="4"/><path d="M158 29q-34 14-29 39l30 15-9 39 26 18 11-40 30-11 7-35-34-26Z" fill="#7ec6a0"/>`;
 const scene={
 L01:flag(),L02:`<circle cx="180" cy="82" r="66" fill="#e9bf62" stroke="#c48d4c" stroke-width="8"/>${txt(180,79,'國',45,'#b54c48')}${txt(180,114,'徽',31,'#b54c48')}`,
 L03:flag(true),L04:`<circle cx="180" cy="84" r="65" fill="#e25352" stroke="#e6ba64" stroke-width="7"/><text x="180" y="107" font-size="65" text-anchor="middle" fill="white">✿</text>`,
 L05:flag()+`<circle cx="295" cy="122" r="15" fill="#f1bf9b"/><path d="M279 155q0-25 16-25t16 25" fill="#85b7d8"/>`,
 L06:`<text x="180" y="105" text-anchor="middle" font-size="85" fill="#d96b5c">♫</text><text x="252" y="82" font-size="42" fill="#eab85a">♪</text>`,
 L07:book('憲法','#dc6560'),L08:book('基本法','#579fc4'),L09:calendar('4'),L10:globe+txt(180,90,'香港',24,'#704f3b'),
 L11:calendar('4'),L12:flag()+`<circle cx="295" cy="122" r="15" fill="#f1bf9b"/><path d="M279 155q0-25 16-25t16 25" fill="#85b7d8"/>`,L13:`<text x="180" y="110" font-size="95" text-anchor="middle" fill="#d96b5c">♫</text>`,
 L14:globe+txt(180,90,'香港',24,'#704f3b'),L15:flag(true),L16:book('憲法','#dc6560'),L17:school,L18:people,L19:`<rect x="120" y="22" width="120" height="130" rx="14" fill="#f8fafc" stroke="#d1a777" stroke-width="5"/><path d="M144 59l15 14 27-31M144 112l15 14 27-31" stroke="#5ca77e" stroke-width="8" fill="none" stroke-linecap="round"/>`,L20:globe+txt(180,90,'香港',24,'#704f3b')};
 return card(scene[id]||school);
}

function renderQuestion(){const {q,step,level,selected,submitted,optionOrder}=state;const stage=levels[level][step];const isClassification=stage==='H3';const dots=levels[level].map((s,i)=>{let cls=i===step?'active':i<step?(state.answers[i]?'correct':'wrong'):'';return `<span class="dot ${cls}" aria-label="第${i+1}關">${i<step?(state.answers[i]?'✓':'×'):i+1}</span>`}).join('');const opts=(isClassification?['公民權利','公民義務','兩者皆是']:optionOrder).map((v,i)=>`<button class="choice ${selected===v?'selected':''} ${submitted&&v===q[2]?'answer':''} ${submitted&&selected===v&&v!==q[2]?'missed':''}" data-option="${esc(v)}" ${submitted?'disabled':''} aria-pressed="${selected===v}">${esc(v)}</button>`).join('');app.innerHTML=`<div class="gamehead"><span class="pill">${level==='junior'?'🌱 初級組':'🏆 進階組'}</span><div class="progress">${dots}</div><button class="secondary" id="home" style="padding:9px 14px;min-height:40px;font-size:14px">⌂ 首頁</button></div><h2 class="stage-title">第${step+1}關 · ${esc(stages[stage])}</h2><p class="instruction">${isClassification?'閱讀情境，選出正確分類':stage==='L1'?'觀察圖像提示，選出正確答案':'閱讀知識卡，選出正確配對'}</p><div class="question">${picture(q)}${stage.startsWith('H')?`<div class="qicon" aria-hidden="true">${q[6]}</div>`:''}<div class="qtext">${esc(q[1])}</div>${stage==='H3'?'<div class="qsmall">本關依據國家《憲法》的公民權利與義務條文</div>':''}</div><div class="choices">${opts}</div><div id="response" aria-live="polite">${submitted?feedbackHtml():''}</div><div class="bottom">${submitted?`<button class="primary" id="next">${step===levels[level].length-1?'查看挑戰結果　🏅':'下一關　➜'}</button>`:`<button class="primary" id="confirm" ${selected===null?'disabled':''}>確認答案　✓</button>`}</div>`;app.querySelector('#home').addEventListener('click',()=>{if(confirm('確定返回首頁？本次挑戰進度將會清除。'))home()});app.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{state.selected=b.dataset.option;renderQuestion()}));if(!submitted){app.querySelector('#confirm').addEventListener('click',submit)}else{app.querySelector('#next').addEventListener('click',next)}}
function feedbackHtml(){const correct=state.selected===state.q[2];return `<div class="feedback ${correct?'good':'bad'}">${correct?'🌟 答對了！':'📖 這題的正確答案是：'+esc(state.q[2])}<div style="font-weight:600;font-size:15px;margin-top:5px">${esc(state.q[5])}</div></div>`}
function submit(){if(state.selected===null||state.submitted)return;state.submitted=true;state.answers.push(state.selected===state.q[2]);renderQuestion()}
function next(){if(state.step+1<levels[state.level].length){state.step++;loadQuestion()}else result()}
function result(){state.view='result';const score=state.answers.filter(Boolean).length;const total=state.answers.length;const win=score===total;const stars=state.answers.map(v=>`<span class="star ${v?'on':''}">${v?'⭐':'☆'}</span>`).join('');app.innerHTML=`${win?`<div class="confetti" aria-hidden="true">${Array.from({length:24},(_,i)=>`<i style="left:${(i*43)%100}%;background:${['#ef6a63','#f2b449','#67c6b1','#83b9e7'][i%4]};animation-delay:${(i%8)*.19}s"></i>`).join('')}</div>`:''}<div class="result"><div class="medal">${win?'🏆':'🦉'}</div><h2>${win?'恭喜你，挑戰成功！':'完成挑戰，繼續加油！'}</h2><div class="stars">${stars}</div><div class="score">答對 ${score} / ${total} 題</div><div class="result-note">${win?'🎁 你已全部答對！請向學生大使領取小禮物。':'💛 謝謝你參加！今次未能全部答對，記住剛才學到的憲法知識，下次再挑戰！'}</div><div class="bottom"><button class="primary" id="again">下一位參加者　➜</button></div><p class="hint">請由學生大使確認成績及派發獎品。</p></div>`;app.querySelector('#again').addEventListener('click',home)}
home();
</script></body></html>

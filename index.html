const officialTiles={
 '中國國旗':'./images/national-flag.png','中國國徽':'./images/national-emblem.png',
 '香港區旗':'./images/hk-flag.gif','香港區徽':'./images/hk-emblem.gif'
};
const tileEmoji={
 '升旗禮':'🇨🇳','頒獎禮':'🏅','生日會':'🎂',
 '奏唱國歌':'🎼','唱生日歌':'🎂','唱兒歌':'🎶',
 '《憲法》':'📕','《基本法》':'📘','故事書':'📚','字典':'📖',
 '國家憲法日':'🗓️','國慶日':'🎉','元旦':'🎊',
 '香港':'🌺','北京':'🏯','上海':'🏙️'
};
function marked(v){const {selected,submitted,q}=state;return `${selected===v?'chosen':''} ${submitted&&v===q[2]?'correct':''} ${submitted&&selected===v&&v!==q[2]?'incorrect':''}`}
function tileVisual(v){return officialTiles[v]?`<img src="${officialTiles[v]}" alt="${esc(v)}" loading="eager">`:`<span class="tile-emoji" aria-hidden="true">${tileEmoji[v]||'🧩'}</span>`}
function stageContent(stage,q){
 const options=state.optionOrder;
 if(stage==='L1'){
  if(['L01','L02','L03','L04'].includes(q[0])){
   const pictureFile={L01:'national-flag.png',L02:'national-emblem.png',L03:'hk-flag.gif',L04:'hk-emblem.gif'}[q[0]];
   return `<div class="challenge-area junior-truth"><p class="stage-hint">👀 看圖，判斷對或錯</p><div class="junior-truth-image"><img src="./images/${pictureFile}" alt="題目圖案"></div><div class="stage-visual-question">${esc(q[1])}</div><div class="junior-truth-options"><button class="junior-truth-button yes ${marked('正確')}" data-option="正確" ${state.submitted?'disabled':''}>⭕<span>對</span></button><button class="junior-truth-button no ${marked('錯誤')}" data-option="錯誤" ${state.submitted?'disabled':''}>❌<span>錯</span></button></div></div>`;
  }
  return `<div class="challenge-area"><p class="stage-hint">🔍 先看大圖，再選答案</p>${picture(q)}<div class="stage-visual-question">${esc(q[1])}</div><div class="visual-grid">${options.map(v=>`<button class="visual-card ${marked(v)}" data-option="${esc(v)}" ${state.submitted?'disabled':''}>${tileVisual(v)}<span>${esc(v)}</span></button>`).join('')}</div></div>`;
 }
 if(stage==='L2')return `<div class="challenge-area"><p class="stage-hint">🧩 拖動拼圖塊到空格，或直接點選拼圖塊填入</p><div class="puzzle-frame"><div class="puzzle-sentence">${esc(q[1])}</div><button class="puzzle-hole ${state.selected?'filled':''}" id="puzzle-hole" aria-label="拼圖放置位置">${state.selected?esc(state.selected):'將拼圖放到這裏 ＋'}</button></div><div class="puzzle-pieces">${options.map(v=>`<button class="piece ${marked(v)}" data-piece="${esc(v)}" draggable="true" ${state.submitted?'disabled':''}>${esc(v)}</button>`).join('')}</div></div>`;
 if(stage==='H2'){
 const c=state.truthCards[state.truthIndex];
 return `<div class="challenge-area truth-challenge"><p class="stage-hint">⚖️ 閱讀說法，判斷「正確」或「錯誤」；答對這項說法即可過關</p><div class="pair-score">判斷 ${state.truthIndex+1} / 1</div><div class="truth-card"><div class="truth-icon">📜</div><div>${esc(c.text)}</div></div><div class="truth-buttons"><button class="truth-btn truth-yes" data-truth="true">✓ 正確</button><button class="truth-btn truth-no" data-truth="false">✕ 錯誤</button></div><p class="stage-hint">${state.truthAnswers.length?'已完成上一項判斷，繼續下一項':''}</p></div>`;
 }
 if(stage==='H1'){
 const done=new Set(state.pairs.map(x=>x[0]));const linked=new Set(state.pairs.map(x=>x[1]));
 const isConcept=stage==='H2';
 return `<div class="challenge-area"><p class="stage-hint">${isConcept?'🔗':'🃏'} 先點左邊一張${isConcept?'概念':'知識'}卡，再點右邊對應卡，完成一組配對</p><div class="pair-score">已連結 ${state.pairs.length} / 1 組 ${state.pairError?' · 剛才配對有誤，請完成剩餘配對（本關不計分）':''}</div><div class="real-match"><div class="match-col">${state.pairQuestions.map((x,i)=>`<button class="pair-source ${state.activeSource===i?'pair-active':''} ${done.has(i)?'pair-done':''}" data-source="${i}" ${done.has(i)||state.submitted?'disabled':''}><span>${x[6]}</span>${esc(x[1])}</button>`).join('')}</div><div class="pair-center">${state.pairs.map(()=>'<span>🔗</span>').join('')||'→'}</div><div class="match-col">${state.pairTargets.map(v=>`<button class="pair-target ${linked.has(v)?'pair-done':''}" data-target="${esc(v)}" ${linked.has(v)||state.submitted?'disabled':''}>${esc(v)}</button>`).join('')}</div></div></div>`;
 }
 const bins=[['公民權利','🎁'],['公民義務','🤝'],['兩者皆是','⚖️']];
 return `<div class="challenge-area"><p class="stage-hint">📦 拖動情境卡到分類箱；也可以點選情境卡，再點分類箱</p><div class="sort-scenario drag-scenario" draggable="true" id="drag-scenario">${esc(q[1])}<small>☝️ 拖動我</small></div><div class="sort-bins">${bins.map(([v,e])=>`<button class="bin ${marked(v)}" data-bin="${esc(v)}" ${state.submitted?'disabled':''}><span class="bin-icon">${e}</span>${esc(v)}${state.selected===v?'<span class="bin-stamp">✓ 已放入</span>':''}</button>`).join('')}</div><p class="stage-hint">本關依據國家《憲法》的公民權利與義務條文</p></div>`;
}
function choose(v){if(state.submitted)return;state.selected=v;renderQuestion()}
function pairSelectSource(i){if(state.submitted)return;state.activeSource=i;state.pairError=false;renderQuestion()}
function pairSelectTarget(v){if(state.submitted||state.activeSource===null)return;const i=state.activeSource;const correct=state.pairQuestions[i][2];if(v===correct){state.pairs.push([i,v]);state.pairError=false}else {state.pairError=true;state.pairMistakes=true}state.activeSource=null;if(state.pairs.length===1){state.selected=state.pairMistakes?"配對曾出錯":state.q[2];state.submitted=true;state.answers.push(!state.pairMistakes)}renderQuestion()}
function judgeTruth(answer){
 if(state.submitted)return;
 const card=state.truthCards[state.truthIndex];
 state.truthAnswers.push(answer===card.answer);
 if(state.truthIndex<state.truthCards.length-1){state.truthIndex=1;}else{
  state.submitted=true;
  state.answers.push(state.truthAnswers.every(Boolean));
 }
 renderQuestion();
}
function wireChallenges(stage){
 if(stage==='H2'){app.querySelectorAll('[data-truth]').forEach(b=>b.addEventListener('click',()=>judgeTruth(b.dataset.truth==='true')));return;}
 if(stage==='H1'){
  app.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>pairSelectSource(Number(b.dataset.source))));
  app.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>pairSelectTarget(b.dataset.target)));
  return;
 }
 if(stage==='L2'){
  app.querySelectorAll('[data-piece]').forEach(b=>{
   b.addEventListener('click',()=>choose(b.dataset.piece));
   b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.piece));
   attachPointerDrag(b,()=>b.dataset.piece,'#puzzle-hole');
  });
  const hole=app.querySelector('#puzzle-hole');hole.addEventListener('click',()=>{if(state.selected!==null)renderQuestion()});
  hole.addEventListener('dragover',e=>e.preventDefault());hole.addEventListener('drop',e=>{e.preventDefault();choose(e.dataTransfer.getData('text/plain'))});return;
 }
 if(stage==='H3'){
  app.querySelectorAll('[data-bin]').forEach(b=>{b.addEventListener('click',()=>choose(b.dataset.bin));b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();choose(b.dataset.bin)})});
  const card=app.querySelector('#drag-scenario');card.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','scenario'));
  attachPointerDrag(card,()=>null,'[data-bin]');return;
 }
 app.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.option)));
}
function attachPointerDrag(el,value,targetSelector){
 let start=null,ghost=null;
 el.addEventListener('pointerdown',e=>{if(state.submitted||e.pointerType==='mouse')return;start={x:e.clientX,y:e.clientY,id:e.pointerId};});
 el.addEventListener('pointermove',e=>{if(!start||start.id!==e.pointerId)return;const distance=Math.hypot(e.clientX-start.x,e.clientY-start.y);if(distance<12&&!ghost)return;if(!ghost){ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');document.body.appendChild(ghost);el.setPointerCapture(e.pointerId)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'});
 el.addEventListener('pointerup',e=>{if(!start)return;const dragging=!!ghost;if(ghost){ghost.remove();ghost=null}if(dragging){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(targetSelector);if(target){if(targetSelector==='[data-bin]')choose(target.dataset.bin);else choose(value())}}start=null});
 el.addEventListener('pointercancel',()=>{if(ghost){ghost.remove();ghost=null}start=null});
}
function renderQuestion(){
 const {q,step,level,selected,submitted}=state;
 const stage=levels[level][step];
 const dots=levels[level].map((s,i)=>{let cls=i===step?'active':i<step?(state.answers[i]?'correct':'wrong'):'';return `<span class="dot ${cls}" aria-label="第${i+1}關">${i<step?(state.answers[i]?'✓':'×'):i+1}</span>`}).join('');
 const instructions={L1:'看圖答題：有時選圖片，有時判對錯',L2:'選擇拼圖，完成知識卡',H1:'知識卡與答案卡配對',H2:'判斷一項憲法知識說法的真偽',H3:'把情境卡放進正確分類箱'};
 app.innerHTML=`<div class="gamehead"><span class="pill">${level==='junior'?'🌱 初級組':'🏆 進階組'}</span><div class="progress">${dots}</div><button class="secondary" id="home" style="padding:9px 14px;min-height:40px;font-size:14px">⌂ 首頁</button></div><h2 class="stage-title">第${step+1}關 · ${esc(stages[stage])}</h2><p class="instruction">${instructions[stage]}</p>${stageContent(stage,q)}<div id="response" aria-live="polite">${submitted?feedbackHtml():''}</div><div class="bottom">${submitted?`<button class="primary" id="next">${step===levels[level].length-1?'查看挑戰結果　🏅':'下一關　➜'}</button>`:(stage==='H1'||stage==='H2'?'':`<button class="primary" id="confirm" ${selected===null?'disabled':''}>確認答案　✓</button>`)}</div>`;
 app.querySelector('#home').addEventListener('click',()=>{if(confirm('確定返回首頁？本次挑戰進度將會清除。'))home()});
 wireChallenges(stage);
 if(!submitted&&stage!=='H1'&&stage!=='H2')app.querySelector('#confirm').addEventListener('click',submit);
 if(submitted)app.querySelector('#next').addEventListener('click',next);
}
function feedbackHtml(){
 const stage=levels[state.level][state.step];
 if(stage==='H2'){const correct=state.truthAnswers.every(Boolean);return `<div class="feedback ${correct?'good':'bad'}">${correct?'🌟 判斷正確！':'📖 判斷不正確，本關不計分。'}<div style="font-weight:600;font-size:15px;margin-top:5px">${esc(state.q[5])}</div></div>`;}
 if(stage==='H1'){
  const correct=!state.pairMistakes && state.pairs.length===1;
  return `<div class="feedback ${correct?'good':'bad'}">${correct?'🌟 配對正確！':'📖 配對已完成，但過程中曾有錯誤，本關不計分。'}<div style="font-weight:600;font-size:15px;margin-top:5px">${esc(state.q[5])}</div></div>`;
 }
 const correct=state.selected===state.q[2];
 return `<div class="feedback ${correct?'good':'bad'}">${correct?'🌟 答對了！':'📖 這題的正確答案是：'+esc(state.q[2])}<div style="font-weight:600;font-size:15px;margin-top:5px">${esc(state.q[5])}</div></div>`;
}
function submit(){if(state.selected===null||state.submitted)return;state.submitted=true;state.answers.push(state.selected===state.q[2]);renderQuestion()}
function next(){if(state.step+1<levels[state.level].length){state.step++;loadQuestion()}else result()}
function result(){state.view='result';const score=state.answers.filter(Boolean).length;const total=state.answers.length;const win=score===total;const stars=state.answers.map(v=>`<span class="star ${v?'on':''}">${v?'⭐':'☆'}</span>`).join('');app.innerHTML=`${win?`<div class="confetti" aria-hidden="true">${Array.from({length:24},(_,i)=>`<i style="left:${(i*43)%100}%;background:${['#ef6a63','#f2b449','#67c6b1','#83b9e7'][i%4]};animation-delay:${(i%8)*.19}s"></i>`).join('')}</div>`:''}<div class="result"><div class="medal">${win?'🏆':'🦉'}</div><h2>${win?'恭喜你，挑戰成功！':'完成挑戰，繼續加油！'}</h2><div class="stars">${stars}</div><div class="score">答對 ${score} / ${total} 題</div><div class="result-note">${win?'🎁 你已全部答對！請向學生大使領取小禮物。':'💛 謝謝你參加！今次未能全部答對，記住剛才學到的憲法知識，下次再挑戰！'}</div><div class="bottom"><button class="primary" id="again">下一位參加者　➜</button></div><p class="hint">請由學生大使確認成績及派發獎品。</p></div>`;app.querySelector('#again').addEventListener('click',home)}
home();
// GitHub Pages offline support. First visit online; reload once after service worker activates.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.warn('離線功能未能啟用', e)));
}
</script></body></html>
